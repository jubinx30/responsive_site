<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/scrollreveal"></script>
    <title>responsive_site</title>
  </head>
  <body class="bg-linear-to-r from-blue-700 via-blue-800 to-gray-900 text-white">
  <div class="min-h-screen px-6 py-3  flex flex-col gap-10 md:px-10 lg:px-16 lg:py-7">
    <header class="flex justify-between">
      <a href="" class="flex items-center">
        <h1 class="text-4xl font-bold">
          WFA.
        </h1>
      </a>
      <ul class="hidden lg:flex lg:gap-10 lg:items-center lg:text-lg lg:font-medium">
        <li><a href="">Locations</a></li>
        <li><a href="">Offerings</a></li>
        <li><a href="">Pricing</a></li>
        <li><a href="">About Us</a></li>
      </ul>
      <div class="hidden lg:flex lg:gap-10 lg:items-center lg:text-lg lg:font-medium">
        <a href="">Login</a>
        <button class="bg-purple-900 px-3 py-1 font-medium rounded-md">Register</button>
      </div>
      <div class="lg:hidden">
        <i class="fa-solid fa-bars fa-2x"></i>
      </div>
    </header>

    <main class="lg:flex">
        <div class="flex items-center justify-center lg:flex-1 order-2 lg:justify-end image-animation">
          <img src="https://img.magnific.com/free-vector/cute-man-working-laptop-with-coffee-cartoon-vector-icon-illustration-people-technology-icon-concept-isolated-premium-vector-flat-cartoon-style_138676-3869.jpg?semt=ais_hybrid&w=740&q=80" alt="" class="rounded-2xl shadow-2xl shadow-blue-300 lg:h-150 lg:w-150 lg:rounded-full">
        </div>

        <div class="space-y-6 mt-16 lg:mt-32 lg:flex-1 text-animation">
          <div class="text-7xl font-bold leading-tight">
              <h1>Let's Switch</h1>
              <h1>To Remote</h1>
          </div>
          <p>WFA povided top-notch office spaces in prime location across 150+ countries.</p>
          <form action="" class="flex flex-col gap-2 md:flex-row md:gap-0">
               <input type="text" placeholder="Enter City" class="sm:w-3/5 sm:py-3 max-md:rounded-md md:rounded-l-md bg-gray-200 rounded-md px-4 py-2 text-black md:w-80" />
               <button class="bg-purple-900 px-4 py-3 sm:w-3/5 rounded-md md:ml-4 md:w-40 font-medium whitespace-nowrap">Find your Office</button>
          </form>

          <div class="flex flex-col gap-4 py-8">
            <p class="font-semibold">Used by these companies:</p>
            <ul class="flex gap-6">
              <li><i class="fa-brands fa-square-x-twitter fa-2x"></i></li>
              <li><i class="fa-brands fa-bluesky fa-2x"></i></li>
              <li><i class="fa-brands fa-square-instagram fa-2x"></i></li>
              <li><i class="fa-brands fa-facebook-f fa-2x"></i></li>
            </ul>
          </div>

        </div>
    </main>

  </div>

    <script type="module" src="/src/main.ts"></script>
    <script>
      const scroll = ScrollReveal({
        reset:true,
        duration:2600,
        distance:'60px'
      })
      scroll.reveal('.image-animation',{delay:400,origin:'top'})
      scroll.reveal('.text-animation',{delay:300, origin:'left'})
    </script>
  </body>
</html>
